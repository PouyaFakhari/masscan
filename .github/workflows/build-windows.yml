name: Build and Release masscan for Windows (x64)

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # Repository is at D:\a\masscan\masscan (runner workspace)

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download Npcap SDK
        shell: pwsh
        run: |
          # Download SDK to a temp location
          curl -L -o $env:RUNNER_TEMP\npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          tar -xf $env:RUNNER_TEMP\npcap-sdk.zip -C $env:RUNNER_TEMP

      - name: Place Npcap SDK where the project expects it
        shell: pwsh
        run: |
          # The .vcxproj looks for ..\..\npcap-sdk (two levels up from vs10)
          # So we place it in the PARENT of the workspace, i.e., alongside the masscan repo folder
          $targetPath = "$env:GITHUB_WORKSPACE\..\npcap-sdk"
          Copy-Item -Path "$env:RUNNER_TEMP\npcap-sdk" -Destination $targetPath -Recurse -Force
          Write-Host "SDK placed at: $targetPath"

      - name: Build masscan (Release x64)
        run: |
          msbuild vs10\masscan.sln `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:WindowsTargetPlatformVersion=10.0 `
            /m
        shell: pwsh

      - name: Verify build output
        shell: cmd
        run: |
          if not exist "bin\masscan.exe" exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: masscan-win64
          path: bin\masscan.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin\masscan.exe
          name: ${{ github.ref_name }}
          body: |
            Automated masscan Windows 64-bit build.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
