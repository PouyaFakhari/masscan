name: Build and Release masscan for Windows (x64)

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Npcap SDK
        shell: pwsh
        run: |
          curl -L -o npcap-sdk.zip https://npcap.com/dist/npcap-sdk-1.13.zip
          tar -xf npcap-sdk.zip
          echo "PCAP_DIR=$env:GITHUB_WORKSPACE\npcap-sdk" >> $env:GITHUB_ENV

      - name: Verify Npcap SDK layout
        shell: pwsh
        run: |
          Get-ChildItem -Recurse $env:PCAP_DIR | Select-Object FullName

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build masscan
        shell: cmd
        run: |
          nmake -f Makefile.msvc

      - name: Check binary
        shell: cmd
        run: |
          if not exist "bin\masscan.exe" exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: masscan-win64
          path: bin\masscan.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin\masscan.exe
          name: ${{ github.ref_name }}
          body: |
            Automated masscan Windows 64-bit build.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
